name: Deploy to o2switch

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: "24"

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npx next build --webpack

      - name: Install lftp
        run: sudo apt-get install -y lftp

      - name: Deploy via FTP
        run: |
          mkdir -p deploy/public deploy/tmp
          cp -r .next/standalone/* deploy/
          cp -r public/* deploy/public/
          cp server.js deploy/server.js
          touch deploy/tmp/restart.txt

          lftp -f "
            set ftp:ssl-allow yes
            set ssl:verify-certificate no
            open -u ${{ secrets.O2SWITCH_FTP_USER }},${{ secrets.O2SWITCH_FTP_PASSWORD }} ${{ secrets.O2SWITCH_FTP_HOST }}
            cd nextapp
            mirror --reverse --delete --verbose --parallel=4 ./deploy/ ./
            bye
          "
