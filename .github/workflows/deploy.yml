name: Deploy to o2switch

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: "24"

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npx next build --webpack

      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: terre.o2switch.net
          username: sc4bovu7233
          key: ${{ secrets.O2SWITCH_SSH_KEY }}
          passphrase: ${{ secrets.O2SWITCH_SSH_PASSPHRASE }}
          port: 22
          script: |
            set -e
            export PATH="/opt/alt/alt-nodejs20/root/usr/bin:$PATH"
            APP_DIR="/home/sc4bovu7233/nextapp"

            if [ ! -d "$APP_DIR/.git" ]; then
              mkdir -p $APP_DIR
              git clone https://github.com/stevedelcourt/mentivis-os.git $APP_DIR
            fi

            cd $APP_DIR
            git pull origin main
            npm install --omit=dev
            npx next build --webpack

            # Copy static assets to standalone
            if [ -d ".next/standalone" ]; then
              cp -r public/* .next/standalone/public/ 2>/dev/null || true
              cp -r .next/static .next/standalone/.next/static/ 2>/dev/null || true
            fi

            mkdir -p tmp
            touch tmp/restart.txt
            echo "Deploy complete"
