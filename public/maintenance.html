<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>MentivisOS — Maintenance</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  html,body {
    width:100%; height:100%;
    background:#09090b;
    color:#e4e4e7;
    font-family:Inter,-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;
    overflow:hidden;
  }
  .wrap {
    width:100%; height:100%;
    display:flex; flex-direction:column;
    align-items:center; justify-content:center;
    gap:24px; padding:40px;
  }
  canvas {
    display:block; background:transparent;
    flex-shrink:0;
  }
  .text {
    text-align:center; max-width:420px;
    flex-shrink:0;
  }
  .logo { margin-bottom:20px; opacity:.7; }
  .logo img { height:32px; width:auto; }
  h1 {
    font-size:17px; font-weight:600; letter-spacing:-.01em;
    margin-bottom:6px; color:#fafafa;
  }
  p { font-size:13px; color:#71717a; }
  .divider {
    width:24px; height:1px; background:#27272a;
    margin:12px auto;
  }
  .en h1, .en p { display:block; }
</style>
</head>
<body>
<div class="wrap">
  <canvas id="c"></canvas>
  <div class="text">
    <div class="logo">
      <img src="/images/MentivisOS/mentivisos-logomark-blanc.svg" alt="MentivisOS">
    </div>
    <div>
      <h1>MentivisOS est temporairement indisponible</h1>
      <p>De retour dans quelques instants.</p>
    </div>
    <div class="divider"></div>
    <div class="en">
      <h1 style="font-size:15px;">MentivisOS is temporarily unavailable</h1>
      <p>We'll be back shortly.</p>
    </div>
  </div>
</div>
<script>
const canvas=document.getElementById('c');
const ctx=canvas.getContext('2d');

const VERTS=Array.from({length:16},(_,i)=>[
  ((i>>0)&1)*2-1, ((i>>1)&1)*2-1,
  ((i>>2)&1)*2-1, ((i>>3)&1)*2-1
]);

const EDGES=[];
for(let i=0;i<16;i++)
  for(let j=i+1;j<16;j++){
    const d=VERTS[i].reduce((s,v,k)=>s+(v!==VERTS[j][k]?1:0),0);
    if(d===1)EDGES.push([i,j]);
  }

const FACES=[];
for(let d1=0;d1<4;d1++)
  for(let d2=d1+1;d2<4;d2++){
    const fr=[0,1,2,3].filter(d=>d!==d1&&d!==d2);
    for(let s1=-1;s1<=1;s1+=2)
      for(let s2=-1;s2<=1;s2+=2){
        const vi=[];
        for(let a=-1;a<=1;a+=2)
          for(let b=-1;b<=1;b+=2){
            const c=[0,0,0,0];
            c[d1]=s1;c[d2]=s2;c[fr[0]]=a;c[fr[1]]=b;
            vi.push(VERTS.findIndex(v=>v.every((x,k)=>x===c[k])));
          }
        FACES.push([vi[0],vi[2],vi[3],vi[1]]);
      }
  }

const lerp=(a,b,t)=>a+(b-a)*Math.min(1,Math.max(0,t));
const clamp=(v,lo,hi)=>Math.min(hi,Math.max(lo,v));

function rot4(v,a,b,θ){
  const r=[...v],c=Math.cos(θ),s=Math.sin(θ);
  r[a]=c*v[a]-s*v[b]; r[b]=s*v[a]+c*v[b];
  return r;
}

function transform(v4,t,S){
  let p=[...v4];
  p=rot4(p,0,3,t*0.44);
  p=rot4(p,1,2,t*0.29);
  p=rot4(p,0,1,t*0.17);
  p=rot4(p,2,3,t*0.23);

  const r4=[...p];
  const[x,y,z,w]=p;

  const d4=2.5, f4=1/(d4-w);
  const x3=x*f4, y3=y*f4, z3=z*f4;

  const tilt=0.38;
  const y3t=Math.cos(tilt)*y3-Math.sin(tilt)*z3;
  const z3t=Math.sin(tilt)*y3+Math.cos(tilt)*z3;

  const f3=1/(2.5-z3t);
  const sc=S*0.63;

  return{
    sx:S/2+x3*f3*sc,
    sy:S/2+y3t*f3*sc,
    r4,
    w,
    depth:z3t+w*0.15
  };
}

function colorAt(x4,y4,z4,w4){
  const hue=((Math.atan2(y4,x4)*180/Math.PI)+360)%360;
  const xyR=clamp(Math.sqrt(x4*x4+y4*y4)/1.42,0,1);
  const sat=Math.round(lerp(42,92,xyR));
  const lit=Math.round(lerp(34,66,(z4+2)/4));
  const alpha=lerp(0.05,0.54,(w4+2)/4);
  return{hue,sat,lit,alpha};
}

let DPR=1, CS=0;
function resize(){
  DPR=Math.min(window.devicePixelRatio||1,2);
  CS=Math.min(window.innerWidth,window.innerHeight)*0.48;
  canvas.style.width=canvas.style.height=CS+'px';
  canvas.width=canvas.height=Math.round(CS*DPR);
  ctx.setTransform(DPR,0,0,DPR,0,0);
}
window.addEventListener('resize',resize);
resize();

function draw(now){
  const t=now*0.001;
  const S=Math.round(canvas.width/DPR);

  ctx.clearRect(0,0,S,S);

  const P=VERTS.map(v=>transform(v,t,S));

  const faceList=FACES.map(verts=>{
    const fv=verts.map(i=>P[i]);
    const c4=[0,0,0,0];
    fv.forEach(p=>p.r4.forEach((v,k)=>{c4[k]+=v/4}));
    return{fv,c4,avgDepth:fv.reduce((s,p)=>s+p.depth,0)/4};
  }).sort((a,b)=>a.avgDepth-b.avgDepth);

  faceList.forEach(({fv,c4})=>{
    const fcx=fv.reduce((s,p)=>s+p.sx,0)/4;
    const fcy=fv.reduce((s,p)=>s+p.sy,0)/4;
    const verts=[...fv].sort((a,b)=>
      Math.atan2(a.sy-fcy,a.sx-fcx)-Math.atan2(b.sy-fcy,b.sx-fcx)
    );

    let area=0;
    for(let i=0;i<4;i++){
      const j=(i+1)%4;
      area+=verts[i].sx*verts[j].sy-verts[j].sx*verts[i].sy;
    }

    const col=colorAt(c4[0],c4[1],c4[2],c4[3]);
    const alpha=area>0 ? col.alpha : col.alpha*0.48;
    const hue  =area>0 ? col.hue   : (col.hue+22)%360;
    const lit  =area>0 ? col.lit   : col.lit-6;

    ctx.save();
    ctx.beginPath();
    verts.forEach((p,i)=>i?ctx.lineTo(p.sx,p.sy):ctx.moveTo(p.sx,p.sy));
    ctx.closePath();
    ctx.fillStyle=`hsla(${hue.toFixed(1)},${col.sat}%,${lit}%,${alpha.toFixed(3)})`;
    ctx.fill();
    ctx.restore();
  });

  ctx.lineCap='round';
  EDGES.map(([i,j])=>({
    i,j,
    tw:clamp((P[i].w+P[j].w)*0.5/2+0.5,0,1),
    depth:(P[i].depth+P[j].depth)*0.5
  }))
  .sort((a,b)=>a.depth-b.depth)
  .forEach(({i,j,tw})=>{
    ctx.save();
    ctx.lineWidth=lerp(0.18,1.4,tw);
    ctx.strokeStyle=`rgba(228,228,231,${lerp(0.04,0.55,tw).toFixed(3)})`;
    ctx.beginPath();
    ctx.moveTo(P[i].sx,P[i].sy);
    ctx.lineTo(P[j].sx,P[j].sy);
    ctx.stroke();
    ctx.restore();
  });

  requestAnimationFrame(draw);
}

requestAnimationFrame(draw);
</script>
</body>
</html>
