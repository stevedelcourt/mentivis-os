<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>MentivisOS — Maintenance</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  html,body { width:100%; height:100%; }
  body {
    background:#09090b;
    color:#e4e4e7;
    font-family:Inter,-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;
  }
  canvas {
    position:fixed; inset:0; z-index:0;
    background:transparent;
  }
  .overlay {
    position:fixed; inset:0; z-index:1;
    display:flex; align-items:center; justify-content:center;
    text-align:center; padding:24px;
    pointer-events:none;
  }
  .box { max-width:420px; }
  .logo { margin-bottom:32px; opacity:.7; }
  .logo img { height:36px; width:auto; }
  h1 {
    font-size:18px; font-weight:600; letter-spacing:-.01em;
    margin-bottom:8px; color:#fafafa;
  }
  p { font-size:14px; color:#71717a; }
  .divider {
    width:32px; height:1px; background:#27272a;
    margin:16px auto;
  }
  .en h1, .en p { display:block; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<div class="overlay">
  <div class="box">
    <div class="logo">
      <img src="/images/MentivisOS/mentivisos-logomark-blanc.svg" alt="MentivisOS">
    </div>
    <div>
      <h1>MentivisOS est temporairement indisponible</h1>
      <p>De retour dans quelques instants.</p>
    </div>
    <div class="divider"></div>
    <div class="en">
      <h1 style="font-size:16px;">MentivisOS is temporarily unavailable</h1>
      <p>We'll be back shortly.</p>
    </div>
  </div>
</div>
<script>
const canvas = document.getElementById('c');
const ctx    = canvas.getContext('2d');

const VERTS = Array.from({length:16},(_,i)=>[
  ((i>>0)&1)*2-1, ((i>>1)&1)*2-1,
  ((i>>2)&1)*2-1, ((i>>3)&1)*2-1
]);

const EDGES=[];
for(let i=0;i<16;i++)
  for(let j=i+1;j<16;j++){
    const d=VERTS[i].reduce((s,v,k)=>s+(v!==VERTS[j][k]?1:0),0);
    if(d===1)EDGES.push([i,j]);
  }

const lerp=(a,b,t)=>a+(b-a)*Math.min(1,Math.max(0,t));

function rot4(v,a,b,θ){
  const r=[...v],c=Math.cos(θ),s=Math.sin(θ);
  r[a]=c*v[a]-s*v[b]; r[b]=s*v[a]+c*v[b];
  return r;
}

function project(v4,t,S){
  let p=[...v4];
  p=rot4(p,0,3,t*0.44);
  p=rot4(p,1,2,t*0.29);
  p=rot4(p,0,1,t*0.17);
  p=rot4(p,2,3,t*0.23);

  const[x,y,z,w]=p;

  const d4=2.5, f4=1/(d4-w);
  const[x3,y3,z3]=[x*f4,y*f4,z*f4];

  const tilt=0.38;
  const y3t=Math.cos(tilt)*y3-Math.sin(tilt)*z3;
  const z3t=Math.sin(tilt)*y3+Math.cos(tilt)*z3;

  const d3=2.5, f3=1/(d3-z3t);
  const sc=S*0.63;

  return{
    sx: S/2+x3*f3*sc,
    sy: S/2+y3t*f3*sc,
    w,
    depth: z3t+w*0.15
  };
}

let DPR=1;
function resize(){
  DPR=Math.min(window.devicePixelRatio||1,2);
  const S=Math.min(window.innerWidth,window.innerHeight);
  canvas.style.width=canvas.style.height=S+'px';
  canvas.width=canvas.height=Math.round(S*DPR);
  ctx.setTransform(DPR,0,0,DPR,0,0);
}
window.addEventListener('resize',resize);
resize();

function draw(now){
  const t=now*0.001;
  const S=Math.round(canvas.width/DPR);

  ctx.clearRect(0,0,S,S);

  const P=VERTS.map((v,vi)=>{
    const p=project(v,t,S);
    const pulse=1+0.18*Math.sin(t*2.6+vi*0.44);
    return{...p,pulse};
  });

  const sorted=EDGES.map(([i,j])=>({
    i,j,
    w:(P[i].w+P[j].w)*0.5,
    depth:(P[i].depth+P[j].depth)*0.5
  })).sort((a,b)=>a.depth-b.depth);

  ctx.lineCap='round';
  sorted.forEach(({i,j,w})=>{
    const p1=P[i],p2=P[j];
    const tw=Math.max(0,Math.min(1,(w+1)*0.5));
    const alpha=lerp(0.04,0.45,tw);
    const lw=lerp(0.4,1.6,tw);

    ctx.save();
    ctx.lineWidth=lw;
    ctx.strokeStyle='rgba(228,228,231,'+alpha.toFixed(3)+')';
    ctx.beginPath();
    ctx.moveTo(p1.sx,p1.sy);
    ctx.lineTo(p2.sx,p2.sy);
    ctx.stroke();
    ctx.restore();
  });

  P.forEach(p=>{
    const tw=Math.max(0,Math.min(1,(p.w+1)*0.5));
    const alpha=lerp(0.04,0.55,tw);
    const sz=lerp(1.5,4.5,tw)*p.pulse;
    ctx.fillStyle='rgba(228,228,231,'+alpha.toFixed(3)+')';
    ctx.fillRect(p.sx-sz/2,p.sy-sz/2,sz,sz);
  });

  requestAnimationFrame(draw);
}

requestAnimationFrame(draw);
</script>
</body>
</html>
