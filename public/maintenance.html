<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>MentivisOS — Maintenance</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  body {
    background:#09090b;
    color:#e4e4e7;
    font-family:Inter,-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;
    display:flex; align-items:center; justify-content:center;
    min-height:100vh; text-align:center; padding:24px;
    line-height:1.6;
  }
  .box { max-width:420px; }
  .tesseract { margin-bottom:28px; }
  .tesseract svg { width:100px; height:auto; }
  .tesseract .loop {
    animation:spin 6s linear infinite;
    transform-origin:0 0;
  }
  @keyframes spin {
    0%   { transform:rotate(0deg); }
    100% { transform:rotate(360deg); }
  }
  .tesseract .outer-cube { stroke:#71717a; stroke-width:1; fill:none; }
  .tesseract .inner-cube { stroke:#52525b; stroke-width:1; fill:none; }
  .tesseract .connector { stroke:#3f3f46; stroke-width:0.8; fill:none; }
  .logo { margin-bottom:32px; opacity:.7; }
  .logo img { height:36px; width:auto; }
  h1 {
    font-size:18px; font-weight:600; letter-spacing:-.01em;
    margin-bottom:8px; color:#fafafa;
  }
  p { font-size:14px; color:#71717a; }
  .divider {
    width:32px; height:1px; background:#27272a;
    margin:16px auto;
  }
  .en h1, .en p { display:block; }
</style>
</head>
<body>
<div class="box">
  <div class="tesseract">
    <svg viewBox="-70 -55 140 95" xmlns="http://www.w3.org/2000/svg">
      <g class="loop">
        <g class="outer-cube">
          <line x1="-58" y1="-29" x2="45" y2="-29"/><line x1="45" y1="-29" x2="52" y2="30"/>
          <line x1="52" y1="30" x2="-52" y2="30"/><line x1="-52" y1="30" x2="-58" y2="-29"/>
          <line x1="-39" y1="-48" x2="65" y2="-48"/><line x1="65" y1="-48" x2="72" y2="10"/>
          <line x1="72" y1="10" x2="-33" y2="10"/><line x1="-33" y1="10" x2="-39" y2="-48"/>
          <line x1="-58" y1="-29" x2="-39" y2="-48"/><line x1="45" y1="-29" x2="65" y2="-48"/>
          <line x1="52" y1="30" x2="72" y2="10"/><line x1="-52" y1="30" x2="-33" y2="10"/>
        </g>
        <g class="inner-cube">
          <line x1="-29" y1="-9" x2="23" y2="-9"/><line x1="23" y1="-9" x2="26" y2="21"/>
          <line x1="26" y1="21" x2="-26" y2="21"/><line x1="-26" y1="21" x2="-29" y2="-9"/>
          <line x1="-20" y1="-22" x2="33" y2="-22"/><line x1="33" y1="-22" x2="36" y2="8"/>
          <line x1="36" y1="8" x2="-16" y2="8"/><line x1="-16" y1="8" x2="-20" y2="-22"/>
          <line x1="-29" y1="-9" x2="-20" y2="-22"/><line x1="23" y1="-9" x2="33" y2="-22"/>
          <line x1="26" y1="21" x2="36" y2="8"/><line x1="-26" y1="21" x2="-16" y2="8"/>
        </g>
        <g class="connector">
          <line x1="-58" y1="-29" x2="-29" y2="-9"/><line x1="45" y1="-29" x2="23" y2="-9"/>
          <line x1="52" y1="30" x2="26" y2="21"/><line x1="-52" y1="30" x2="-26" y2="21"/>
          <line x1="-39" y1="-48" x2="-20" y2="-22"/><line x1="65" y1="-48" x2="33" y2="-22"/>
          <line x1="72" y1="10" x2="36" y2="8"/><line x1="-33" y1="10" x2="-16" y2="8"/>
        </g>
      </g>
    </svg>
  </div>
  <div class="logo">
    <img src="/images/MentivisOS/mentivisos-logomark-blanc.svg" alt="MentivisOS">
  </div>
  <div>
    <h1>MentivisOS est temporairement indisponible</h1>
    <p>De retour dans quelques instants.</p>
  </div>
  <div class="divider"></div>
  <div class="en">
    <h1 style="font-size:16px;">MentivisOS is temporarily unavailable</h1>
    <p>We'll be back shortly.</p>
  </div>
</div>
</body>
</html>
