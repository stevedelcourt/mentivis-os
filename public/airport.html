<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Les envies — departures board</title>
<link href="https://fonts.googleapis.com/css2?family=Handjet:wght@300&display=swap" rel="stylesheet">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    background: #0d0d0f;
    width: 100vw;
    height: 100vh;
    overflow: hidden;
    font-family: 'Handjet', monospace;
    font-weight: 300;
  }

  #board {
    width: 100%;
    height: 100vh;
    display: flex;
    flex-direction: column;
    justify-content: space-evenly;
    padding: clamp(12px, 1.5vh, 24px);
    gap: clamp(2px, 0.3vh, 6px);
  }

  .row {
    display: flex;
    justify-content: center;
    gap: 2px;
  }

  .flap-unit {
    position: relative;
    display: flex;
    align-items: center;
    justify-content: center;
    width: clamp(16px, 2.8vw, 30px);
    height: clamp(22px, 4.2vh, 42px);
    background: #222226;
    border: 0.5px solid #2e2e34;
    border-radius: 3px;
    overflow: hidden;
    flex-shrink: 0;
    font-size: clamp(11px, 2.6vh, 24px);
    font-weight: 300;
    color: #e8e8ed;
    text-transform: uppercase;
    text-shadow: 0 0 6px rgba(255,255,255,.08);
    letter-spacing: 0.02em;
  }

  .flap-unit::after {
    content: '';
    position: absolute;
    left: 0;
    right: 0;
    top: 50%;
    height: 1px;
    background: #2e2e34;
    transform: translateY(-0.5px);
  }

  .flap-space {
    display: inline-block;
    width: 14px;
    flex-shrink: 0;
  }
</style>
</head>
<body>
  <div id="board"></div>
  <script>
(function() {

const FLIP_CHARS = 'ABCDEFGHIJKLMNOPQRSTUVWXYZÉÈÊÀÂÙÎÔÇ0123456789';
const ROTATION_MS = 3500;
const STAGGER_MS = 35;
const FLIP_STEP_MS = 50;
const FLIP_MIN = 5;
const FLIP_EXTRA = 4;
const ROW_STAGGER_MS = 80;

const board = document.getElementById('board');
let items = [];
let rows = [];
let rowCount = 0;

function measureRowHeight() {
  const probe = document.createElement('div');
  probe.className = 'row';
  const unit = document.createElement('span');
  unit.className = 'flap-unit';
  probe.appendChild(unit);
  document.body.appendChild(probe);
  const h = probe.getBoundingClientRect().height;
  document.body.removeChild(probe);
  return h;
}

function calcRowCount() {
  const rh = measureRowHeight();
  const gap = parseFloat(getComputedStyle(board).gap) || 4;
  const pad = 24;
  const available = window.innerHeight - pad;
  return Math.max(20, Math.floor(available / (rh + gap)));
}

function buildRow(word) {
  const row = document.createElement('div');
  row.className = 'row';
  const spans = [];
  for (let i = 0; i < word.length; i++) {
    const ch = word[i];
    if (ch === ' ') {
      const sp = document.createElement('span');
      sp.className = 'flap-space';
      row.appendChild(sp);
      spans.push(null);
    } else {
      const el = document.createElement('span');
      el.className = 'flap-unit';
      el.textContent = '';
      row.appendChild(el);
      spans.push(el);
    }
  }
  board.appendChild(row);
  return { row, word, spans };
}

function flipRow(entry, word) {
  const { row, spans } = entry;
  const currentLen = spans.length;
  const newLen = word.length;

  if (currentLen !== newLen) {
    row.innerHTML = '';
    spans.length = 0;
    for (let i = 0; i < word.length; i++) {
      const ch = word[i];
      if (ch === ' ') {
        const sp = document.createElement('span');
        sp.className = 'flap-space';
        row.appendChild(sp);
        spans.push(null);
      } else {
        const el = document.createElement('span');
        el.className = 'flap-unit';
        el.textContent = '';
        row.appendChild(el);
        spans.push(el);
      }
    }
  }

  for (let i = 0; i < word.length; i++) {
    const el = spans[i];
    if (!el) continue;
    if (word[i] === ' ') continue;

    const finalChar = word[i];
    const steps = FLIP_MIN + Math.floor(Math.random() * FLIP_EXTRA);
    let step = 0;

    setTimeout(() => {
      el.textContent = '';
      const timer = setInterval(() => {
        if (step < steps - 1) {
          el.textContent = FLIP_CHARS[Math.floor(Math.random() * FLIP_CHARS.length)];
          el.style.transform = 'scaleY(0.85)';
          setTimeout(() => { el.style.transform = 'scaleY(1)'; }, 30);
        } else {
          clearInterval(timer);
          el.textContent = finalChar;
        }
        step++;
      }, FLIP_STEP_MS);
    }, i * STAGGER_MS);
  }

  entry.word = word;
}

function tickAll() {
  for (let r = 0; r < rowCount; r++) {
    const idx = Math.floor(Math.random() * items.length);
    const word = items[idx];
    setTimeout(() => flipRow(rows[r], word), r * ROW_STAGGER_MS);
  }
}

function initBoard() {
  board.innerHTML = '';
  rowCount = calcRowCount();
  rows = [];

  for (let r = 0; r < rowCount; r++) {
    const idx = r % items.length;
    const entry = buildRow(items[idx]);
    rows.push(entry);
  }
}

fetch('/envies.txt')
  .then(r => r.text())
  .then(text => {
    items = text.split('\n').map(l => l.trim()).filter(Boolean);
    if (items.length > 0) {
      initBoard();
      setTimeout(tickAll, 500);
      setInterval(tickAll, ROTATION_MS);
    }
  })
  .catch(() => {});

window.addEventListener('resize', () => {
  if (items.length > 0) {
    const newCount = calcRowCount();
    if (newCount !== rowCount) {
      initBoard();
    }
  }
});

})();
</script>
</body>
</html>
